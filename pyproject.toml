[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motonormativity-eval"
version = "0.1.0"
description = "Inspect AI evaluation for motonormativity bias in language models"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.0",
]

[project.entry-points.inspect_ai]
motonormativity_eval = "motonormativity"

[tool.hatch.build.targets.wheel]
packages = ["src/motonormativity"]

[tool.hatch.build.targets.wheel.sources]
"src/motonormativity" = "motonormativity"
